name = "newyorkcomputeclub"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

routes = [
  { pattern = "newyorkcomputeclub.com", custom_domain = true },
  { pattern = "www.newyorkcomputeclub.com", custom_domain = true },
]

# top level on purpose: after a [table] header this would nest inside it
send_email = [
  { name = "OWNER_EMAIL", destination_address = "james.baker1628@gmail.com" },
]

[triggers]
# daily application digest, 13:00 utc = morning in new york
crons = ["0 13 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "SIGNUPS"
id = "bf7443c719ec4cd585a7690f699a1dca"
