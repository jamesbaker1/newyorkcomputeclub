<!doctype html>
<!-- no framework, no build step. one worker, one canvas, one list.
     the island is a histogram. the park is empty on purpose.
     the missing diagonal is broadway. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0C0A">
<title>New York Compute Club</title>
<meta name="description" content="Pooled GPUs. Five boroughs.">
<meta property="og:title" content="New York Compute Club">
<meta property="og:description" content="Pooled GPUs. Five boroughs.">
<meta property="og:url" content="https://newyorkcomputeclub.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E0C0A'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23FF4E00'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: 'Anton';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/anton-latin.woff2') format('woff2');
  }
  :root {
    --paper: #0E0C0A;
    --ink: #EDE6DA;
    --heat: #FF4E00;
    --heat-text: #FF8A4A;
    --fade: #7A7160;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--heat); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--heat); outline-offset: 3px; }

  #city {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  .sheet {
    position: relative;
    z-index: 2;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header, footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px 24px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .08em;
    color: var(--fade);
  }
  header { padding: 22px 28px 0; }
  footer { padding: 0 28px 20px; }

  main {
    margin-top: auto;
    padding: 0 26px 40px;
    max-width: 980px;
  }
  h1 {
    font-family: 'Anton', 'Arial Narrow', var(--sans);
    font-size: clamp(3.2rem, 12.5vw, 9rem);
    font-weight: 400;
    line-height: .88;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 0;
  }
  .tag {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--fade);
    margin: 20px 0 0;
    letter-spacing: .02em;
  }

  form { margin-top: 30px; }
  .row { display: flex; gap: 14px; }
  input[type=email] {
    flex: 1 1 200px;
    max-width: 320px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--ink);
    border-radius: 0;
    padding: 12px 2px;
  }
  input[type=email]::placeholder { color: var(--fade); opacity: .75; }
  input[type=email]:focus { outline: none; border-color: var(--heat); }
  button {
    flex: 0 0 auto;
    width: 54px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 18px;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    border-radius: 0;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--heat); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  #status {
    display: block;
    min-height: 1.4em;
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--heat-text);
  }

  @media (max-height: 560px) {
    .tag { display: none; }
    form { margin-top: 18px; }
  }
</style>
</head>
<body>

<canvas id="city" aria-hidden="true"></canvas>

<div class="sheet">
  <header>
    <span>est. mmxxvi</span>
    <span>40.7411&deg;N&ensp;73.9897&deg;W</span>
  </header>

  <main>
    <h1>New York<br>Compute Club</h1>
    <p class="tag">pooled gpus. five boroughs. hardware you can bike to.</p>

    <form id="join" novalidate>
      <div class="row">
        <label class="hp" for="email">email</label>
        <input id="email" name="email" type="email" placeholder="email" autocomplete="email" spellcheck="false" required>
        <!-- humans never see this field; bots can't resist it -->
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" aria-label="get on the list">&rarr;</button>
      </div>
      <output id="status" role="status" aria-live="polite"></output>
    </form>
  </main>

  <footer>
    <span>a club, not a cloud.</span>
    <span>&copy; mmxxvi</span>
  </footer>
</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';

console.log('%cNEW YORK COMPUTE CLUB', 'font-weight:bold;background:#FF4E00;color:#0E0C0A;padding:2px 8px;');
console.log('the island is live. the park is empty on purpose.\nthe missing diagonal is broadway. get on the list.');

// ---------------------------------------------------------------- the island
// manhattan as a load histogram: one instanced box per lot, height = load.
// heat wanders the grid on its own; your cursor overrides it.

const PAPER = 0x0E0C0A;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let surge = () => {};

function buildCity() {
  const canvas = document.getElementById('city');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setClearColor(PAPER, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(PAPER, 0.0135);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);

  scene.add(new THREE.AmbientLight(0x8a8078, 0.6));
  const sun = new THREE.DirectionalLight(0xfff2e2, 1.3);
  sun.position.set(-30, 42, -18); // late light off the hudson
  scene.add(sun);

  // deterministic per-lot randomness
  const hash = (ix, iz) => {
    let h = (ix * 374761393 + iz * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  const lerp = (a, b, t) => a + (b - a) * t;
  const vnoise = (x, z) => {
    const xi = Math.floor(x), zi = Math.floor(z);
    const u = (x - xi) ** 2 * (3 - 2 * (x - xi));
    const v = (z - zi) ** 2 * (3 - 2 * (z - zi));
    const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, z) =>
    0.55 * vnoise(x, z) + 0.30 * vnoise(x * 2.1 + 7.3, z * 2.1 + 3.1) + 0.15 * vnoise(x * 4.3 + 13.7, z * 4.3 + 9.2);
  const gauss = (d, s) => Math.exp(-(d * d) / (2 * s * s));

  // the grid: z runs south (-) to north (+). carve the shoreline, the park,
  // and broadway; weight height toward midtown and downtown.
  const broadway = z => 1.5 - 0.1226 * (z + 33);
  const lots = [];
  for (let ix = -11; ix <= 11; ix++) {
    for (let iz = -35; iz <= 35; iz++) {
      if ((Math.abs(ix) / 9.8) ** 2.2 + (Math.abs(iz) / 33.5) ** 2.2 > 1) continue; // water
      if (ix > -2.6 && ix < 2.6 && iz > 6 && iz < 19) continue;                     // central park
      if (Math.abs(ix - broadway(iz)) < 0.55) continue;                             // broadway
      const r = hash(ix, iz);
      const shore = (Math.abs(ix) / 9.8) ** 2.2 + (Math.abs(iz) / 33.5) ** 2.2;
      let base =
        0.5 +
        5.2 * gauss(iz - 2, 6.5) * gauss(ix - 0.5, 5.0) +  // midtown
        4.4 * gauss(iz + 25, 4.5) * gauss(ix, 3.2);        // downtown
      base *= 1 - shore * 0.55;
      if (r > 0.986) base *= 1.9;                          // supertalls
      lots.push({ x: ix, z: iz, r, base, fp: 0.60 + 0.22 * r, fp2: 0.60 + 0.22 * hash(iz, ix) });
    }
  }

  const geo = new THREE.BoxGeometry(1, 1, 1);
  geo.translate(0, 0.5, 0); // grow from the ground
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const mesh = new THREE.InstancedMesh(geo, mat, lots.length);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);

  const m4 = new THREE.Matrix4();
  const col = new THREE.Color();
  const heatCol = new THREE.Color(0xFF4E00);
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ray = new THREE.Raycaster();
  const hit = new THREE.Vector3();

  // heat source: roams by itself, follows the pointer when one shows up
  const heat = { x: 0, z: -20, tx: 0, tz: -20 };
  let pointerAt = -1e9;
  const nd = new THREE.Vector2();
  addEventListener('pointermove', e => {
    nd.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(nd, camera);
    if (ray.ray.intersectPlane(ground, hit)) {
      heat.tx = Math.max(-11, Math.min(11, hit.x));
      heat.tz = Math.max(-35, Math.min(35, hit.z));
      pointerAt = performance.now();
    }
  }, { passive: true });

  let pulse = 0;
  surge = () => { pulse = 1; };

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 0.8 ? 52 : 38;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', () => { resize(); if (REDUCED) frame(17); });
  resize();

  function frame(t) {
    // camera drifts like a slow ferry
    camera.position.set(17 + 3 * Math.sin(t * 0.04), 15, -56);
    camera.lookAt(1, 3, -4);

    if (performance.now() - pointerAt > 4000) {
      heat.tx = 6.5 * Math.sin(t * 0.13) + 2 * Math.sin(t * 0.31);
      heat.tz = 26 * Math.sin(t * 0.045 + 1.2);
    }
    heat.x = lerp(heat.x, heat.tx, 0.05);
    heat.z = lerp(heat.z, heat.tz, 0.05);
    pulse *= 0.965;

    for (let i = 0; i < lots.length; i++) {
      const L = lots[i];
      const load = fbm(L.x * 0.09 + t * 0.05, L.z * 0.09 - t * 0.02);
      const dh = Math.hypot(L.x - heat.x, L.z - heat.z);
      const hot = gauss(dh, 3.4);
      const h = Math.max(0.12, L.base * (0.30 + 0.85 * load) + hot * 2.4 + pulse * L.base * 0.55);

      m4.makeScale(L.fp, h, L.fp2);
      m4.setPosition(L.x, 0, L.z);
      mesh.setMatrixAt(i, m4);

      const g = 0.30 + 0.16 * L.r;
      col.setRGB(g * 1.06, g * 0.97, g * 0.85);
      const warm = Math.min(1, hot * 0.9 + pulse * 0.35 + Math.max(0, load - 0.72) * 0.9);
      col.lerp(heatCol, warm);
      mesh.setColorAt(i, col);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
    renderer.render(scene, camera);
  }

  if (REDUCED) {
    frame(17);
  } else {
    renderer.setAnimationLoop(ms => frame(ms / 1000));
  }
}

try { buildCity(); } catch (e) { console.log('no webgl. the list still works.', e?.message ?? e); }

// ---------------------------------------------------------------- the list
const form = document.getElementById('join');
const input = document.getElementById('email');
const status = document.getElementById('status');
const btn = form.querySelector('button');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = input.value.trim();
  if (!email) { input.focus(); return; }
  btn.disabled = true;
  status.textContent = '...';
  try {
    const res = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, company: form.company.value }),
    });
    const data = await res.json();
    status.textContent = (data.ok ? data.message : data.error) + '.';
    if (data.ok) { input.value = ''; surge(); }
  } catch {
    status.textContent = 'network said no. try again.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
