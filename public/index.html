<!doctype html>
<!-- one worker, one canvas, one list.
     the islands are histograms. the park is empty on purpose.
     the missing diagonal is broadway. new jersey is not rendered.
     the lights above the city are real buildings: 60 hudson st,
     111 8th ave, the teleport. the packets are jobs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0C0A">
<title>new york compute club</title>
<script type="module" src="/js/city.min.js"></script>
<meta name="description" content="pooled gpus. five boroughs.">
<meta property="og:title" content="new york compute club">
<meta property="og:description" content="pooled gpus. five boroughs.">
<meta property="og:url" content="https://newyorkcomputeclub.com">
<meta property="og:image" content="https://newyorkcomputeclub.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E0C0A'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23FF4E00'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: 'Anton';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/anton-latin.woff2') format('woff2');
  }
  :root {
    --paper: #0E0C0A;
    --ink: #EDE6DA;
    --heat: #FF4E00;
    --heat-text: #FF8A4A;
    --fade: #8E8472;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--heat); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--heat); outline-offset: 3px; }
  a { color: inherit; }

  #city {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #city.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #city { transition: none; } }

  .sheet {
    position: relative;
    z-index: 2;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: linear-gradient(to top, rgba(14,12,10,.78), rgba(14,12,10,0) 42%);
  }
  header, footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px 24px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .08em;
    color: var(--fade);
  }
  header { padding: 22px 28px 0; }
  footer { padding: 0 28px 20px; }
  header a, footer a {
    color: var(--fade);
    text-decoration: none;
    border-bottom: 1px solid rgba(142,132,114,.5);
    /* visual size stays; the touch box grows to ~44px */
    padding: 14px 14px 15px;
    margin: -14px;
  }
  header a:hover, header a:focus-visible,
  footer a:hover, footer a:focus-visible { color: var(--heat-text); border-color: var(--heat); }

  main {
    margin-top: auto;
    padding: 0 26px 40px;
    max-width: 980px;
  }
  h1 {
    font-family: 'Anton', 'Arial Narrow', var(--sans);
    font-size: clamp(3.2rem, 12.5vw, 9rem);
    font-weight: 400;
    line-height: .88;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 0;
  }
  .tag {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--fade);
    margin: 20px 0 0;
    letter-spacing: .02em;
  }

  form { margin-top: 30px; }
  .row { display: flex; gap: 14px; }
  input[type=email] {
    flex: 1 1 200px;
    min-width: 0;
    max-width: 320px;
    font-family: var(--mono);
    font-size: 16px; /* under 16px, iOS zooms the page on focus */
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--ink);
    border-radius: 0;
    padding: 12px 2px;
  }
  input[type=email]::placeholder { color: var(--fade); }
  input[type=email]:focus { outline: none; border-color: var(--heat); }
  button {
    flex: 0 0 auto;
    width: 54px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    border-radius: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover, button:focus-visible { background: var(--heat); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  #status {
    display: block;
    min-height: 1.4em;
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--heat-text);
  }

  @media (max-height: 620px) {
    /* short screens: the scrim has to reach the wordmark */
    .sheet { background: linear-gradient(to top, rgba(14,12,10,.78), rgba(14,12,10,0) 72%); }
  }
  @media (max-height: 560px) {
    .tag { display: none; }
    form { margin-top: 18px; }
    main { padding-bottom: 24px; }
  }
</style>
</head>
<body>

<canvas id="city" aria-hidden="true"></canvas>

<div class="sheet">
  <header>
    <span>est. mmxxvi</span>
    <a href="/about">about</a>
  </header>

  <main>
    <h1>New York<br>Compute Club</h1>
    <p class="tag">pooled gpus. five boroughs. hardware you can bike to.</p>
    <p class="tag" id="gridline" hidden></p>

    <form id="join" novalidate>
      <div class="row">
        <label class="hp" for="email">email</label>
        <input id="email" name="email" type="email" placeholder="email" autocomplete="email" spellcheck="false" required>
        <!-- humans never see this field; bots can't resist it -->
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" aria-label="apply">&rarr;</button>
      </div>
      <output id="status" role="status" aria-live="polite"></output>
    </form>
  </main>

  <footer>
    <span>a club, not a cloud.</span>
    <span>40.7411&deg;N&ensp;73.9897&deg;W</span>
  </footer>
</div>

<script>
// ------------------------------------------------------------------ the grid
// real numbers when the grid has nodes; the scene reads window.__grid too.
fetch('/api/grid').then(r => r.ok ? r.json() : null).then(g => {
  if (!g || !g.ok || !g.nodes) return;
  window.__grid = g;
  const el = document.getElementById('gridline');
  el.textContent = 'grid: ' + g.nodes + (g.nodes === 1 ? ' node' : ' nodes') +
    ' · ' + g.watts + ' watts';
  el.hidden = false;
}).catch(() => {});

// ---------------------------------------------------------------- the list
const form = document.getElementById('join');
const input = document.getElementById('email');
const status = document.getElementById('status');
const btn = form.querySelector('button');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = input.value.trim();
  if (!email) { status.textContent = 'email first.'; input.focus(); return; }
  btn.disabled = true;
  status.textContent = '...';
  try {
    const res = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, company: form.company.value }),
    });
    const data = await res.json();
    status.textContent = (data.ok ? data.message : data.error) + '.';
    if (data.ok) { input.value = ''; window.__surge && window.__surge(); }
  } catch {
    status.textContent = 'network said no. try again.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
