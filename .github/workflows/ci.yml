name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: bundle builds
        run: npm run build
      - name: bundle is non-empty
        run: test -s public/js/city.min.js
      - name: bundle matches source
        run: git diff --exit-code public/js/city.min.js
